<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Multi Messenger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand" title="Multi Messenger">MM</div>
    <div id="navList" class="nav-list"></div>
    <div class="side-footer">
      <button class="icon-btn" id="btnAdd" title="+">+</button>
      <button class="icon-btn" id="btnLock" title="Lock">&#128274;</button>
      <button class="icon-btn" id="btnSettings" title="Settings">&#9881;</button>
    </div>
  </aside>
  <div id="toolbar" class="toolbar">
    <div id="tabStrip" class="tabstrip"></div>
    <div class="navrow">
      <button class="nav-btn" id="navBack" title="بازگشت">&#8249;</button>
      <button class="nav-btn" id="navForward" title="جلو">&#8250;</button>
      <button class="nav-btn" id="navReload" title="بارگذاری مجدد">&#8635;</button>
      <input id="addressBar" class="address-bar" dir="ltr" spellcheck="false" placeholder="آدرس یا جستجو…" />
      <button class="nav-btn" id="btnBookmark" title="بوکمارک (Ctrl+D)">&#9734;</button>
      <button class="nav-btn activity-btn hidden" id="btnWalletActivity" title="اکتیویتی ولت">&#9889;</button>
      <button class="nav-btn wallet-icon" id="btnWalletProfile" title="ولت این پروفایل">&#128176;</button>
    </div>
    <div id="bookmarksBar" class="bookmarks-bar"></div>
  </div>
  <div id="activityPanel" class="activity-panel hidden">
    <div class="act-resizer" id="actResizer" title="بکش تا اندازه عوض بشه — دابل‌کلیک: برگشت به یک‌پنجم"></div>
    <div class="act-head">
      <div class="act-title"><b>اکتیویتی ولت</b><span id="actProfile" class="muted"></span></div>
      <div class="act-tools">
        <select id="actFilter"><option value="all">همه</option><option value="bad">فقط خطاها</option></select>
        <button class="ghost" id="actClear" title="پاک کردن لاگ">پاک</button>
        <button class="ghost" id="actClose" title="بستن">&times;</button>
      </div>
    </div>
    <div id="actList" class="act-list"></div>
  </div>
  <div id="walletPopup" class="wallet-popup hidden"></div>
  <div id="lockScreen" class="overlay hidden">
    <div class="card">
      <div class="logo-lg">MM</div>
      <h1 id="lockTitle">Multi Messenger</h1>
      <p class="muted" id="lockHint"></p>
      <input id="unlockInput" type="password" />
      <button class="primary" id="unlockBtn">OK</button>
      <p id="unlockErr" class="error"></p>
    </div>
  </div>
  <div id="modal" class="overlay hidden">
    <div class="modal" id="modalBox"></div>
  </div>
  <div id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="ghost" id="drawerClose">X</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </div>
  <div id="ctx" class="ctx hidden"></div>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
